<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanDJmix PRO - Director's Cut</title>
    
    <!-- CONEXIÓN EEL -->
    <script type="text/javascript" src="/eel.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        djzinc: { 950: '#09090b', 900: '#18181b', 800: '#27272a', 700: '#3f3f46' },
                        djcyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
                        djgreen: { 400: '#4ade80', 500: '#22c55e' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        .glass-panel { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(63, 63, 70, 0.5); }
        .selected-row { background: linear-gradient(90deg, rgba(8,145,178,0.15) 0%, rgba(24,24,27,0) 100%); border-left: 3px solid #06b6d4; }
        .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @keyframes pulse-bar { 0%, 100% { height: 20%; } 50% { height: 100%; } }
        .vu-meter-bar { animation: pulse-bar 1.2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-djzinc-950 text-gray-300 h-screen w-screen overflow-hidden antialiased selection:bg-djcyan-500 selection:text-white">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Library: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            Spotify: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Routing: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            Terminal: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Warning: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('audit');
            const [selectedTrack, setSelectedTrack] = useState(null);
            
            // Consola Global
            const [consoleLogs, setConsoleLogs] = useState([
                { type: 'info', text: "> CleanDJmix PRO v2.0 - Core Engine Initialized" },
                { type: 'divider', text: "--------------------------------------------------" },
                { type: 'success', text: "[ OK ] Spotify spotDL module linked." },
                { type: 'success', text: "[ OK ] Serato Database XML located." }
            ]);

            useEffect(() => {
                if (window.eel) {
                    window.eel.expose(log_to_console, 'log_to_console');
                    function log_to_console(text, type = 'system') {
                        setConsoleLogs(prev => [...prev, { type, text: `[${new Date().toLocaleTimeString()}] ${text}` }]);
                    }
                }
            }, []);

            return (
                <div className="flex h-screen w-screen flex-col font-sans">
                    {/* TOP NAVIGATION BAR */}
                    <header className="h-12 bg-djzinc-950 border-b border-djzinc-800 flex items-center px-4 justify-between shrink-0 select-none z-10 relative">
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 group cursor-pointer">
                                <div className="w-8 h-8 flex items-center justify-center transition-transform group-hover:scale-105">
                                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">
                                        <path d="M 75 25 A 35 35 0 1 0 75 75" stroke="url(#logo-grad-main)" strokeWidth="10" strokeLinecap="round" />
                                        <rect x="35" y="45" width="8" height="20" rx="4" fill="#22d3ee" />
                                        <rect x="50" y="32" width="8" height="46" rx="4" fill="#06b6d4" />
                                        <rect x="65" y="50" width="8" height="10" rx="4" fill="#0891b2" />
                                        <path d="M 80 15 Q 80 25 90 25 Q 80 25 80 35 Q 80 25 70 25 Q 80 25 80 15 Z" fill="#4ade80" className="animate-pulse" />
                                        <defs>
                                            <linearGradient id="logo-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
                                                <stop offset="0%" stopColor="#ffffff" />
                                                <stop offset="100%" stopColor="#22d3ee" />
                                            </linearGradient>
                                        </defs>
                                    </svg>
                                </div>
                                <span className="font-bold text-sm tracking-widest text-white">CLEANDJ<span className="font-light text-djcyan-400">MIX</span></span>
                            </div>
                        </div>

                        <nav className="flex space-x-1 h-full absolute left-1/2 -translate-x-1/2">
                            <TopTab active={activeTab === 'audit'} onClick={() => setActiveTab('audit')} icon={<Icons.Library />} label="Auditoría" />
                            <TopTab active={activeTab === 'spotify'} onClick={() => setActiveTab('spotify')} icon={<Icons.Spotify />} label="Spotify Ingest" />
                            <TopTab active={activeTab === 'taxonomy'} onClick={() => setActiveTab('taxonomy')} icon={<Icons.Routing />} label="Taxonomía" />
                            <TopTab active={activeTab === 'logs'} onClick={() => setActiveTab('logs')} icon={<Icons.Terminal />} label="Consola" />
                        </nav>

                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2 bg-djzinc-900 px-3 py-1.5 rounded-md border border-djzinc-800">
                                <div className="w-2 h-2 rounded-full bg-djgreen-500 shadow-[0_0_5px_#22c55e]"></div>
                                <span className="text-xs font-mono text-gray-400">Serato Link Active</span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN WORKSPACE */}
                    <main className="flex flex-1 overflow-hidden relative bg-[#0f0f13]">
                        {activeTab === 'audit' && <AuditWorkspace selectedTrack={selectedTrack} setSelectedTrack={setSelectedTrack} setConsoleLogs={setConsoleLogs} />}
                        {activeTab === 'spotify' && <SpotifyWorkspace />}
                        {activeTab === 'taxonomy' && <TaxonomyWorkspace />}
                        {activeTab === 'logs' && <LogsWorkspace logs={consoleLogs} setLogs={setConsoleLogs} />}
                    </main>

                    {/* GLOBAL DECK PLAYER */}
                    <footer className="h-20 glass-panel flex items-center justify-between px-6 shrink-0 z-50">
                        <div className="flex items-center gap-4 w-1/3">
                            <div className="w-14 h-14 bg-djzinc-800 rounded-md border border-djzinc-700 overflow-hidden relative group cursor-pointer">
                                <img src="https://placehold.co/100x100/18181b/22d3ee?text=MB" alt="Cover" className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" />
                            </div>
                            <div className="flex flex-col justify-center">
                                <span className="text-sm font-bold text-white leading-tight">Point of Life (Original Mix)</span>
                                <span className="text-xs text-djcyan-400 font-medium">Marco Bailey</span>
                                <div className="flex gap-2 mt-1">
                                    <span className="text-[10px] font-mono bg-djzinc-800 px-1.5 rounded text-gray-400">132.0 BPM</span>
                                    <span className="text-[10px] font-mono bg-djzinc-800 px-1.5 rounded text-gray-400">8A</span>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col items-center justify-center w-1/3">
                            <div className="flex items-center gap-4">
                                <button className="w-10 h-10 rounded bg-djzinc-800 hover:bg-djzinc-700 flex items-center justify-center border-b-2 border-djzinc-950 active:border-b-0 active:translate-y-[2px] transition-all text-xs font-bold text-gray-400">CUE</button>
                                <button className="w-12 h-12 rounded bg-djcyan-600 hover:bg-djcyan-500 flex items-center justify-center border-b-2 border-djcyan-800 active:border-b-0 active:translate-y-[2px] transition-all text-white shadow-[0_0_15px_rgba(8,145,178,0.4)]">
                                    <Icons.Play />
                                </button>
                                <button className="w-10 h-10 rounded bg-djzinc-800 hover:bg-djzinc-700 flex items-center justify-center border-b-2 border-djzinc-950 active:border-b-0 active:translate-y-[2px] transition-all text-xs font-bold text-gray-400">SYNC</button>
                            </div>
                        </div>

                        <div className="w-1/3 flex justify-end items-center h-full py-2">
                            <div className="w-full max-w-md h-full bg-djzinc-950/50 rounded border border-djzinc-800/50 relative overflow-hidden flex items-end justify-between px-1 gap-[1px]">
                                {[...Array(60)].map((_, i) => {
                                    const h = Math.max(10, Math.random() * 100);
                                    const color = i < 15 ? 'bg-rose-500' : (i < 30 ? 'bg-amber-500' : (i < 45 ? 'bg-djcyan-400' : 'bg-blue-500'));
                                    const isPlayed = i < 20;
                                    return (
                                        <div key={i} className={`w-full rounded-t-sm ${isPlayed ? color : 'bg-djzinc-700'} vu-meter-bar`}
                                             style={{ height: `${h}%`, animationDelay: `${i * 0.05}s`, animationDuration: `${0.8 + Math.random()}s` }}>
                                        </div>
                                    )
                                })}
                                <div className="absolute top-0 bottom-0 left-1/3 w-[2px] bg-white shadow-[0_0_8px_white] z-10"></div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const TopTab = ({ active, onClick, icon, label }) => (
            <button
                onClick={onClick}
                className={`flex items-center gap-2 px-6 h-full transition-all border-b-2 text-sm font-medium ${
                    active 
                    ? 'border-djcyan-400 text-white bg-djzinc-900/50' 
                    : 'border-transparent text-gray-400 hover:text-gray-200 hover:bg-djzinc-900/30'
                }`}
            >
                <span className={active ? 'text-djcyan-400' : ''}>{icon}</span>
                {label}
            </button>
        );

        const AuditWorkspace = ({ selectedTrack, setSelectedTrack }) => {
            const dummyTracks = [
                { id: 1, f: "Pearl Jam - Pearl Jam.mp3", a: "Pearl Jam", d: "9:09", b: "120.00", k: "8A", e: 85, s: "ok" },
                { id: 2, f: "Techno Collective - Strobo.mp3", a: "Techno Collective", d: "6:02", b: "135.00", k: "5A", e: 95, s: "ok" },
                { id: 3, f: "Fentanyl Fantasy - Overdose.mp3", a: "Fentanyl Fantasy", d: "5:20", b: "140.00", k: "2B", e: null, s: "pending" },
                { id: 4, f: "David Bowie - DJ.mp3", a: "David Bowie", d: "7:02", b: "115.00", k: "9A", e: 60, s: "error" },
                { id: 5, f: "Avatar Project - Cabrones.mp3", a: "Avatar Project", d: "7:08", b: "128.00", k: "11B", e: 90, s: "ok" },
                { id: 6, f: "Plastikboy - La Mezcla.mp3", a: "Plastikboy", d: "6:26", b: "125.00", k: "10A", e: 80, s: "ok" },
            ];

            const [rutaOrigen, setRutaOrigen] = useState("/Users/admin/Music/ni musica/");
            const [isAuditing, setIsAuditing] = useState(false);
            const [metrics, setMetrics] = useState({ total: 1783, missing: 142, ready: 1641 });
            const [tracks, setTracks] = useState(dummyTracks);

            const handleExplorar = async () => {
                if (window.eel) {
                    const nuevaRuta = await window.eel.seleccionar_directorio()();
                    if (nuevaRuta) setRutaOrigen(nuevaRuta);
                }
            };

            const handleAuditar = async () => {
                if (window.eel && !isAuditing) {
                    setIsAuditing(true);
                    setTracks([]); // Limpiamos para efecto de carga
                    
                    try {
                        const resultado = await window.eel.iniciar_auditoria(rutaOrigen)();
                        setMetrics({
                            total: resultado.total,
                            missing: resultado.sin_meta,
                            ready: resultado.total - resultado.sin_meta
                        });
                        if (resultado.tracks) {
                            setTracks(resultado.tracks);
                        }
                    } catch (err) {
                        console.error("Error conectando con Python:", err);
                    }
                    setIsAuditing(false);
                }
            };

            return (
                <div className="flex w-full h-full">
                    {/* Main Table Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Action Bar (Top) */}
                        <div className="p-4 border-b border-djzinc-800 bg-djzinc-950 flex justify-between items-center shrink-0">
                            <div className="flex gap-4 items-center w-1/2">
                                <div className="flex-1 max-w-md bg-djzinc-900 rounded-md border border-djzinc-700 flex focus-within:border-djcyan-500 transition-colors overflow-hidden">
                                    <span className="bg-djzinc-800 px-3 py-1.5 text-xs text-gray-400 font-mono border-r border-djzinc-700 flex items-center">ORIGEN</span>
                                    <input type="text" value={rutaOrigen} onChange={(e) => setRutaOrigen(e.target.value)} className="flex-1 bg-transparent px-3 py-1.5 text-sm text-gray-200 outline-none font-mono" />
                                </div>
                                <button onClick={handleExplorar} className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded px-4 py-1.5 text-xs font-bold text-gray-300 transition-colors">Explorar</button>
                            </div>

                            <div className="flex gap-3">
                                <button onClick={handleAuditar} className={`text-white px-5 py-2 rounded-md font-semibold text-sm border flex items-center gap-2 transition-all shadow-lg ${isAuditing ? 'bg-djzinc-800 border-djzinc-700 opacity-70 cursor-not-allowed' : 'bg-djzinc-800 hover:bg-djzinc-700 border-djzinc-600'}`}>
                                    {isAuditing ? <div className="w-4 h-4 border-2 border-t-transparent border-white rounded-full animate-spin"></div> : <Icons.Library />}
                                    {isAuditing ? 'Auditando...' : 'Auditar Directorio'}
                                </button>
                                <button className="bg-djcyan-600 hover:bg-djcyan-500 text-white px-5 py-2 rounded-md font-bold text-sm shadow-[0_4px_14px_0_rgba(8,145,178,0.39)] flex items-center gap-2">
                                    Inyectar a Serato
                                </button>
                            </div>
                        </div>

                        {/* Metric Dashboard */}
                        <div className="grid grid-cols-4 gap-px bg-djzinc-800 border-b border-djzinc-800 shrink-0">
                            <div className="bg-djzinc-950 p-4 flex flex-col justify-center">
                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Total Pistas</span>
                                <span className="text-2xl font-mono text-white">{metrics.total.toLocaleString()}</span>
                            </div>
                            <div className="bg-djzinc-950 p-4 flex flex-col justify-center">
                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Sin Metadatos (BPM/Key)</span>
                                <span className="text-2xl font-mono text-amber-500">{metrics.missing.toLocaleString()}</span>
                            </div>
                            <div className="bg-djzinc-950 p-4 flex flex-col justify-center">
                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Listas para Inyectar</span>
                                <span className="text-2xl font-mono text-djgreen-400">{metrics.ready.toLocaleString()}</span>
                            </div>
                            <div className="bg-djzinc-950 p-4 flex items-center justify-between">
                                <div className="flex flex-col">
                                    <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Modo Seguro</span>
                                    <span className="text-sm font-medium text-gray-300">Simulación ON</span>
                                </div>
                                <div className="w-10 h-5 bg-djcyan-600 rounded-full relative cursor-pointer shadow-[0_0_10px_rgba(8,145,178,0.4)]">
                                    <div className="w-4 h-4 bg-white rounded-full absolute right-0.5 top-0.5"></div>
                                </div>
                            </div>
                        </div>

                        {/* ADVANCED SEARCH & FILTERS BAR */}
                        <div className="px-4 py-2 bg-djzinc-900 border-b border-djzinc-800 flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-2 flex-1">
                                <div className="relative w-64">
                                    <svg className="absolute left-2.5 top-2 text-gray-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                    <input type="text" placeholder="Buscar por track, artista o clave..." className="w-full bg-djzinc-950 border border-djzinc-700 rounded-full pl-8 pr-3 py-1.5 text-xs text-gray-300 focus:border-djcyan-500 focus:outline-none transition-colors" />
                                </div>
                                <div className="h-4 w-px bg-djzinc-700 mx-2"></div>
                                <div className="flex gap-2">
                                    <button className="bg-djzinc-800 hover:bg-djzinc-700 text-gray-300 border border-djzinc-700 px-3 py-1 rounded-full text-[10px] font-medium transition-colors">Todos ({metrics.total.toLocaleString()})</button>
                                    <button className="bg-amber-900/30 text-amber-500 hover:bg-amber-900/50 border border-amber-800/50 px-3 py-1 rounded-full text-[10px] font-medium transition-colors">Falta Metadata ({metrics.missing.toLocaleString()})</button>
                                    <button className="bg-red-900/30 text-red-400 hover:bg-red-900/50 border border-red-800/50 px-3 py-1 rounded-full text-[10px] font-medium transition-colors">Errores (12)</button>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-[10px] text-gray-500 font-mono">Orden:</span>
                                <select className="bg-djzinc-950 border border-djzinc-700 text-gray-300 text-xs rounded px-2 py-1 outline-none focus:border-djcyan-500">
                                    <option>BPM (Ascendente)</option>
                                    <option>Alfabetico (A-Z)</option>
                                    <option>Fecha Creación</option>
                                </select>
                            </div>
                        </div>

                        {/* Data Grid */}
                        <div className="flex-1 overflow-auto bg-[#0f0f13]">
                            <table className="w-full text-left text-sm whitespace-nowrap border-collapse">
                                <thead className="sticky top-0 bg-djzinc-900 border-b border-djzinc-700 text-[11px] text-gray-400 uppercase tracking-wider font-bold z-10 shadow-md">
                                    <tr>
                                        <th className="py-3 px-4 w-10"></th>
                                        <th className="py-3 px-4">Archivo / Título</th>
                                        <th className="py-3 px-4">Artista</th>
                                        <th className="py-3 px-4 w-20">Time</th>
                                        <th className="py-3 px-4 w-24">BPM</th>
                                        <th className="py-3 px-4 w-24">Key</th>
                                        <th className="py-3 px-4 w-32">Energy</th>
                                        <th className="py-3 px-4 w-32">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-djzinc-800/50">
                                    {tracks.length === 0 && !isAuditing && (
                                        <tr>
                                            <td colSpan="8" className="py-10 text-center text-gray-500 text-sm">
                                                No hay pistas cargadas. Haz clic en "Auditar Directorio".
                                            </td>
                                        </tr>
                                    )}
                                    {isAuditing && (
                                        <tr>
                                            <td colSpan="8" className="py-10 text-center text-djcyan-500 text-sm animate-pulse">
                                                Analizando archivos en disco...
                                            </td>
                                        </tr>
                                    )}
                                    {tracks.map((row) => (
                                        <tr
                                            key={row.id}
                                            onClick={() => setSelectedTrack(row.id === selectedTrack ? null : row.id)}
                                            className={`cursor-pointer transition-colors group ${selectedTrack === row.id ? 'selected-row bg-djzinc-800/20' : 'hover:bg-djzinc-800/40'}`}
                                        >
                                            <td className="py-2 px-4 text-center relative w-10">
                                                {selectedTrack === row.id ? (
                                                    <span className="text-djcyan-400 animate-pulse flex justify-center"><Icons.Play /></span>
                                                ) : (
                                                    <span className="text-djzinc-600 text-xs group-hover:hidden">{row.id}</span>
                                                )}
                                                <button className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-gray-300 hover:text-white ${selectedTrack === row.id ? 'hidden' : 'hidden group-hover:block'}`}>
                                                    <Icons.Play />
                                                </button>
                                            </td>
                                            <td className="py-2 px-4">
                                                <div className="font-medium text-gray-200">{row.f.replace('.mp3', '')}</div>
                                                <div className="text-[10px] text-gray-500 font-mono">{row.f}</div>
                                            </td>
                                            <td className="py-2 px-4 text-gray-400">{row.a}</td>
                                            <td className="py-2 px-4 text-gray-500 font-mono text-xs">{row.d}</td>
                                            <td className="py-2 px-4">
                                                {row.b !== "0.0" ? (
                                                    <span className="bg-djzinc-900 border border-djzinc-700 text-djcyan-400 px-2 py-0.5 rounded font-mono text-xs shadow-inner">
                                                        {row.b}
                                                    </span>
                                                ) : (
                                                    <span className="text-[10px] text-gray-600 italic">No Data</span>
                                                )}
                                            </td>
                                            <td className="py-2 px-4">
                                                <span className={`px-2 py-0.5 rounded font-mono text-xs font-bold ${row.k.includes('A') ? 'bg-emerald-900/30 text-emerald-400' : 'bg-fuchsia-900/30 text-fuchsia-400'}`}>
                                                    {row.k}
                                                </span>
                                            </td>
                                            <td className="py-2 px-4">
                                                {row.e ? (
                                                    <div className="w-full bg-djzinc-800 rounded-full h-1.5 flex items-center overflow-hidden border border-djzinc-700">
                                                        <div className={`h-full rounded-full ${row.e > 85 ? 'bg-rose-500' : (row.e > 70 ? 'bg-amber-400' : 'bg-blue-400')}`} style={{width: `${row.e}%`}}></div>
                                                    </div>
                                                ) : (
                                                    <span className="text-[10px] text-gray-600 italic">Calculando...</span>
                                                )}
                                            </td>
                                            <td className="py-2 px-4">
                                                <div className="flex items-center gap-1.5">
                                                    {row.s === 'ok' && <><Icons.Check /><span className="text-xs text-djgreen-500">Ready</span></>}
                                                    {row.s === 'pending' && <><span className="w-2 h-2 rounded-full bg-djcyan-500 animate-pulse"></span><span className="text-xs text-djcyan-400">Processing</span></>}
                                                    {row.s === 'error' && <><Icons.Warning /><span className="text-xs text-amber-500">Missing Meta</span></>}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* INSPECTOR PANEL (Right Sidebar) */}
                    {selectedTrack && (
                        <div className="w-80 bg-djzinc-900 border-l border-djzinc-800 flex flex-col shrink-0 slide-in-right shadow-2xl z-20">
                            <div className="p-4 border-b border-djzinc-800 flex justify-between items-center bg-djzinc-950">
                                <h3 className="font-bold text-sm tracking-wide flex items-center gap-2"><Icons.Settings /> INSPECTOR</h3>
                                <button onClick={() => setSelectedTrack(null)} className="text-gray-500 hover:text-white">✕</button>
                            </div>
                            
                            <div className="p-5 flex-1 overflow-y-auto">
                                <div className="w-full aspect-square bg-djzinc-950 rounded-lg border border-djzinc-800 mb-5 relative group overflow-hidden flex items-center justify-center shadow-inner">
                                    <Icons.Library />
                                    <span className="absolute bottom-2 right-2 bg-black/70 px-2 py-1 rounded text-[10px] text-gray-400 backdrop-blur border border-djzinc-800">ID3v2.4</span>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <h4 className="text-[10px] font-bold uppercase text-gray-500 mb-2 border-b border-djzinc-800 pb-1">Etiquetas a Inyectar</h4>
                                        <div className="space-y-2 mt-2">
                                            {['BPM / Clave (Key)', 'Energy Level', 'Danceability', 'Mood', 'Cover Art'].map(tag => (
                                                <label key={tag} className="flex items-center gap-3 p-1.5 hover:bg-djzinc-800 rounded cursor-pointer transition-colors group">
                                                    <div className={`w-4 h-4 rounded border flex items-center justify-center ${tag !== 'Cover Art' ? 'bg-djcyan-600 border-djcyan-500' : 'border-djzinc-600 bg-djzinc-950'}`}>
                                                        {tag !== 'Cover Art' && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"></polyline></svg>}
                                                    </div>
                                                    <span className="text-xs text-gray-300 group-hover:text-white font-medium">{tag}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-[10px] font-bold uppercase text-gray-500 mb-2 border-b border-djzinc-800 pb-1">Comentario Personalizado</h4>
                                        <textarea className="w-full bg-djzinc-950 border border-djzinc-700 rounded p-2 text-xs text-gray-300 focus:border-djcyan-500 focus:outline-none resize-none" rows="3" defaultValue="CleanDJmix PRO: Analyzed & Optimized. Energy: High."></textarea>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="p-4 bg-djzinc-950 border-t border-djzinc-800">
                                <button className="w-full bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 text-white py-2 rounded text-xs font-bold transition-colors">
                                    Guardar Cambios Individuales
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SpotifyWorkspace = () => (
            <div className="flex flex-col h-full p-8 max-w-5xl mx-auto w-full">
                <div className="mb-8 text-center">
                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-djgreen-500/10 mb-4 shadow-[0_0_30px_rgba(34,197,94,0.2)]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </div>
                    <h2 className="text-2xl font-bold text-white mb-2">Ingesta de Playlists (spotDL)</h2>
                    <p className="text-gray-400 text-sm">Descarga audio de alta calidad e inyéctalo directamente en tus Crates de Serato.</p>
                </div>
                
                <div className="flex gap-2 max-w-3xl mx-auto w-full mb-8 relative">
                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input type="text" placeholder="Pega el enlace de Spotify (Playlist, Álbum o Track)..." className="flex-1 bg-djzinc-900 border-2 border-djzinc-700 rounded-lg pl-12 pr-4 py-4 text-lg text-white focus:outline-none focus:border-djgreen-500 focus:bg-djzinc-800 transition-all font-mono placeholder:font-sans placeholder:text-gray-600 shadow-inner" />
                    <button className="bg-djgreen-600 hover:bg-djgreen-500 text-black px-8 py-4 rounded-lg font-bold text-lg shadow-[0_0_20px_rgba(34,197,94,0.3)] transition-all active:scale-95">
                        Analizar
                    </button>
                </div>
                <div className="flex-1 border-2 border-dashed border-djzinc-800 rounded-xl flex flex-col items-center justify-center text-djzinc-600 bg-djzinc-900/30">
                    <p className="font-medium mb-2">Esperando URL...</p>
                    <p className="text-xs">Los archivos descargados pasarán automáticamente por la auditoría.</p>
                </div>
            </div>
        );

        const TaxonomyWorkspace = () => (
            <div className="flex flex-col h-full p-6 w-full">
                <div className="mb-6 flex justify-between items-end border-b border-djzinc-800 pb-4">
                    <div>
                        <h2 className="text-xl font-bold text-white mb-1">Ruteo de Destinos (Serato Crates)</h2>
                        <p className="text-gray-400 text-sm">Define dónde se guardan los archivos físicos basándose en su género principal.</p>
                    </div>
                    <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 text-white px-4 py-2 rounded text-sm font-medium">Añadir Nueva Regla</button>
                </div>
                
                <div className="flex-1 overflow-auto">
                    <div className="bg-djzinc-900 border border-djzinc-700 rounded-xl mb-6 shadow-lg overflow-hidden">
                        <div className="bg-gradient-to-r from-djzinc-800 to-djzinc-900 px-5 py-3 border-b border-djzinc-700 flex items-center gap-3">
                            <div className="w-3 h-3 rounded-full bg-djcyan-500 shadow-[0_0_8px_#06b6d4]"></div>
                            <h3 className="font-bold text-white tracking-wide">TECHNO <span className="font-normal text-gray-500 text-xs ml-2">(Raíz Serato)</span></h3>
                        </div>
                        <div className="p-2">
                            {['Hard Techno', 'Melodic Techno', 'Peak Time'].map(sub => (
                                <div key={sub} className="flex gap-4 items-center p-3 hover:bg-djzinc-800/50 rounded-lg group transition-colors">
                                    <div className="w-6 h-6 border-l-2 border-b-2 border-djzinc-700 rounded-bl-lg ml-2 opacity-50"></div>
                                    <div className="w-32 text-sm font-bold text-gray-300">{sub}</div>
                                    <div className="flex-1 flex items-center gap-2">
                                        <span className="text-xs text-gray-600 uppercase font-mono">➡ Ruta Fija:</span>
                                        <input type="text" defaultValue={`/Music/Serato/Techno/${sub}/`} className="flex-1 bg-djzinc-950 border border-djzinc-800 rounded px-3 py-2 text-xs font-mono text-gray-400 focus:border-djcyan-500 outline-none transition-colors" />
                                        <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded p-2 text-gray-400"><Icons.Routing /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        const LogsWorkspace = ({ logs, setLogs }) => (
            <div className="flex flex-col h-full p-6 w-full bg-black">
                <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                        <Icons.Terminal />
                        <h2 className="text-sm font-bold text-gray-400 font-mono tracking-widest uppercase">System Console</h2>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setLogs([])} className="text-xs text-djcyan-400 hover:text-white transition-colors font-mono">[ Clear ]</button>
                        <button className="text-xs text-gray-500 hover:text-white transition-colors font-mono">[ Export .log ]</button>
                    </div>
                </div>
                
                <div className="flex-1 border border-djzinc-800 rounded p-4 font-mono text-sm overflow-auto flex flex-col-reverse shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
                    <div>
                        {logs.map((log, idx) => (
                            <div key={idx} className={`mb-1 ${
                                log.type === 'info' ? 'text-djcyan-500' : 
                                log.type === 'divider' ? 'text-gray-500 mb-2' : 
                                log.type === 'success' ? 'text-djgreen-400' : 
                                log.type === 'warn' ? 'text-amber-400' : 
                                'text-gray-300'
                            }`}>
                                {log.text}
                            </div>
                        ))}
                        <div className="flex items-center gap-2 mt-2">
                            <span className="w-2 h-4 bg-djcyan-400 animate-pulse"></span>
                        </div>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
