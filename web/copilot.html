<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BEATWAVE LIVE COPILOT — Monitor Táctico de Cabina DJ</title>
    <script type="text/javascript" src="eel.js" onerror="this.onerror=null; window.eel = window.eel || {};"></script>
    <script type="text/javascript" src="js/transport_bridge.js"></script>
    <link rel="stylesheet" href="css/tailwind.min.css">
    <script src="vendor/react.min.js"></script>
    <script src="vendor/react-dom.min.js"></script>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/beatwave.css">
    <style>
        body {
            background-color: #040407;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-syne { font-family: 'Syne', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        @keyframes pulse-danger {
            0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2); }
            50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 8px rgba(239, 68, 68, 0.1); }
        }
        .animate-danger-pulse {
            animation: pulse-danger 1.8s infinite ease-in-out;
        }
        @keyframes pulse-warning {
            0%, 100% { border-color: rgba(245, 158, 11, 0.8); box-shadow: 0 0 20px rgba(245, 158, 11, 0.35), inset 0 0 12px rgba(245, 158, 11, 0.15); }
            50% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 6px rgba(245, 158, 11, 0.1); }
        }
        .animate-warning-pulse {
            animation: pulse-warning 2.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#040407] text-gray-200 antialiased min-h-screen">
    <div id="copilot-root"></div>
    <script src="js/copilot.bundle.js?v=2.9.3"></script>
</body>
</html>
