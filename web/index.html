    <script>
        // Evitar bloqueo por caché de Service Worker en desarrollo local
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var r of registrations) {
                    r.unregister();
                }
            }).catch(function() {});
            if (window.caches) {
                caches.keys().then(function(names) {
                    for (var n of names) {
                        caches.delete(n);
                    }
                }).catch(function() {});
            }
        }
    </script>
