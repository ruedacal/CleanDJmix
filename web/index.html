<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script type="text/javascript" src="/eel.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { djzinc: { 950: '#09090b', 900: '#18181b', 800: '#27272a', 700: '#3f3f46' }, djcyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' }, djgreen: { 400: '#4ade80', 500: '#22c55e' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .glass-panel { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(10px); }
        .selected-row { background: linear-gradient(90deg, rgba(8,145,178,0.2) 0%, rgba(0,0,0,0) 100%); border-left: 3px solid #06b6d4; }
    </style>
</head>
<body class="bg-djzinc-950 text-gray-300 h-screen w-screen overflow-hidden font-sans">
    <div id="root" class="h-full w-full"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const App = () => {
            const [activeTab, setActiveTab] = useState('audit');
            const [logs, setLogs] = useState([{ type: 'info', text: "> CleanDJmix PRO v2.0 - Core Engine Online" }]);
            
            useEffect(() => {
                if(window.eel) window.eel.expose((text, type='info') => setLogs(p => [...p, {type, text: `[${new Date().toLocaleTimeString()}] ${text}`}]), 'log_to_console');
            }, []);

            return (
                <div className="flex h-screen flex-col">
                    <header className="h-12 bg-djzinc-950 border-b border-djzinc-800 flex items-center justify-between px-6 shrink-0 z-10 relative">
                        <div className="font-bold text-sm tracking-widest text-white">CLEANDJ<span className="font-light text-djcyan-400">MIX</span></div>
                        <nav className="flex h-full gap-2 absolute left-1/2 -translate-x-1/2">
                            {['audit', 'taxonomy', 'logs'].map(t => (
                                <button key={t} onClick={() => setActiveTab(t)} className={`px-6 h-full uppercase text-xs font-bold border-b-2 transition-all ${activeTab === t ? 'border-djcyan-400 text-white bg-djzinc-900/50' : 'border-transparent text-gray-500 hover:text-white'}`}>{t}</button>
                            ))}
                        </nav>
                    </header>
                    <main className="flex-1 overflow-hidden bg-[#0f0f13]">
                        {activeTab === 'audit' && <AuditWorkspace />}
                        {activeTab === 'taxonomy' && <TaxonomyWorkspace />}
                        {activeTab === 'logs' && (
                            <div className="p-6 h-full font-mono text-sm overflow-auto flex flex-col-reverse bg-black">
                                <div>{logs.map((l, i) => <div key={i} className={l.type==='error'?'text-red-500':l.type==='success'?'text-djgreen-400':l.type==='warn'?'text-amber-400':'text-djcyan-400'}>{l.text}</div>)}</div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const AuditWorkspace = () => {
            const [ruta, setRuta] = useState("/Users/admin/Music/");
            const [tracks, setTracks] = useState([]);
            const [metrics, setMetrics] = useState({total:0, missing:0});
            const [selectedTrack, setSelectedTrack] = useState(null);
            const [expertData, setExpertData] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [targets, setTargets] = useState({serato:false, rekordbox:false, virtualdj:false, traktor:false});

            const handleAudit = async () => { if(window.eel){ const res = await window.eel.iniciar_auditoria(ruta)(); setTracks(res.tracks || []); setMetrics({total: res.total, missing: res.sin_meta}); } };
            const handleExplorar = async () => { if(window.eel){ const p = await window.eel.seleccionar_directorio()(); if(p) setRuta(p); } };
            
            const analyzeTrack = async (t) => {
                setIsAnalyzing(true);
                if(window.eel){ const res = await window.eel.analizar_track_profundo(t.path)(); setExpertData(res.status === 'ok' ? res : null); }
                setIsAnalyzing(false);
            };

            return (
                <div className="flex h-full">
                    <div className="flex-1 flex flex-col min-w-0">
                        <div className="p-4 border-b border-djzinc-800 bg-djzinc-950 flex justify-between items-center">
                            <div className="flex gap-2 w-1/3">
                                <input value={ruta} onChange={e=>setRuta(e.target.value)} className="flex-1 bg-djzinc-900 border border-djzinc-700 rounded px-3 py-1 text-xs text-white outline-none focus:border-djcyan-500 font-mono" />
                                <button onClick={handleExplorar} className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded px-3 text-xs font-bold text-gray-300">Explorar</button>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex bg-djzinc-900 rounded-lg p-1 border border-djzinc-800">
                                    {['serato', 'rekordbox', 'virtualdj', 'traktor'].map(sw => (
                                        <button key={sw} onClick={() => setTargets(p=>({...p, [sw]:!p[sw]}))} className={`px-3 py-1 rounded text-[10px] font-bold uppercase ${targets[sw] ? 'bg-djcyan-600 text-white shadow-md' : 'text-gray-500 hover:text-white'}`}>{sw}</button>
                                    ))}
                                </div>
                                <button onClick={handleAudit} className="bg-djzinc-800 hover:bg-djzinc-700 text-white px-5 py-1.5 rounded border border-djzinc-600 text-sm font-bold">Auditar (Rápido)</button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="sticky top-0 bg-djzinc-900 border-b border-djzinc-700 text-[11px] text-gray-400 uppercase font-bold">
                                    <tr><th className="py-3 px-4">Track</th><th className="py-3 px-4">BPM</th><th className="py-3 px-4">Key</th><th className="py-3 px-4">Status</th></tr>
                                </thead>
                                <tbody className="divide-y divide-djzinc-800/50">
                                    {tracks.map(t => (
                                        <tr key={t.id} onClick={() => {setSelectedTrack(t); setExpertData(null);}} className={`cursor-pointer group ${selectedTrack?.id === t.id ? 'selected-row bg-djzinc-800/20' : 'hover:bg-djzinc-800/40'}`}>
                                            <td className="py-2 px-4"><div className="text-gray-200 font-medium">{t.titulo}</div><div className="text-[10px] text-gray-500 font-mono">{t.a}</div></td>
                                            <td className="py-2 px-4 text-djcyan-400 font-mono">{t.b}</td>
                                            <td className="py-2 px-4 text-emerald-400 font-mono font-bold">{t.k}</td>
                                            <td className="py-2 px-4">{t.s === 'ok' ? <span className="text-xs text-djgreen-500">Ready</span> : <span className="text-xs text-amber-500">Meta Error</span>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {selectedTrack && (
                        <div className="w-96 bg-djzinc-900 border-l border-djzinc-800 flex flex-col shrink-0 shadow-2xl">
                            <div className="p-4 border-b border-djzinc-800 flex justify-between items-center bg-djzinc-950">
                                <h3 className="font-bold text-sm text-white">INSPECTOR & SMART DJ</h3>
                                <button onClick={() => setSelectedTrack(null)} className="text-gray-500 hover:text-white">✕</button>
                            </div>
                            <div className="p-5 flex-1 overflow-y-auto space-y-4">
                                <div className="bg-djzinc-950 border border-djzinc-800 p-3 rounded">
                                    <h4 className="text-xs font-bold text-gray-500 uppercase border-b border-djzinc-800 pb-1 mb-2">ID3 Básico</h4>
                                    <p className="text-sm text-white font-medium">{selectedTrack.titulo}</p>
                                    <p className="text-xs text-gray-400">{selectedTrack.a}</p>
                                    <div className="flex gap-2 mt-2 font-mono text-xs"><span className="bg-djzinc-800 px-2 rounded text-djcyan-400">{selectedTrack.b} BPM</span><span className="bg-djzinc-800 px-2 rounded text-emerald-400">{selectedTrack.k}</span></div>
                                </div>

                                <button onClick={() => analyzeTrack(selectedTrack)} disabled={isAnalyzing} className="w-full bg-djcyan-600 hover:bg-djcyan-500 text-white font-bold text-xs py-3 rounded shadow-lg transition-all flex items-center justify-center gap-2">
                                    {isAnalyzing ? <div className="w-4 h-4 border-2 border-t-transparent border-white rounded-full animate-spin"></div> : 'Analizar Audio Avanzado (IA)'}
                                </button>

                                {expertData && (
                                    <div className="bg-djzinc-950 border border-djcyan-900/50 p-4 rounded shadow-[0_0_15px_rgba(8,145,178,0.1)]">
                                        <h4 className="text-[10px] font-bold text-djcyan-400 uppercase tracking-widest mb-3">Extracción Heurística</h4>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs text-gray-400">Danceability</span>
                                            <span className="text-xs font-mono font-bold text-white bg-djzinc-800 px-2 rounded">{expertData.danceability}%</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="text-xs text-gray-400">Vibe / Mood</span>
                                            <span className="text-[10px] font-mono font-bold text-purple-400 bg-purple-900/30 px-2 rounded">{expertData.mood}</span>
                                        </div>
                                        <h4 className="text-[10px] font-bold text-gray-500 uppercase border-b border-djzinc-800 pb-1 mb-2">DJ Comment Generado</h4>
                                        <p className="text-xs text-gray-300 italic leading-relaxed">"{expertData.dj_comment}"</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const TaxonomyWorkspace = () => {
            const [mode, setMode] = useState('copy');
            const mock = [{id:1, name:'Track 1', bpm:'135'}, {id:2, name:'Track 2', bpm:'128'}];
            return (
                <div className="flex h-full w-full p-8 max-w-7xl mx-auto gap-8">
                    <div className="w-1/3 flex flex-col">
                        <h3 className="text-xl font-bold text-white mb-4">Unsorted Tracks</h3>
                        <div className="flex-1 bg-djzinc-900/50 border border-djzinc-800 rounded-xl p-4 overflow-auto space-y-2">
                            {mock.map(t => <div draggable="true" key={t.id} className="bg-djzinc-800 p-3 rounded-lg border border-djzinc-700 cursor-grab hover:border-djcyan-500"><div className="text-sm text-gray-200">{t.name}</div></div>)}
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col">
                        <div className="flex justify-between items-end mb-4">
                            <h3 className="text-xl font-bold text-white">Zonas de Ruteo Físico</h3>
                            <div className="flex gap-4">
                                <div className="flex bg-djzinc-900 rounded-lg p-1">
                                    <button onClick={()=>setMode('copy')} className={`px-4 py-1.5 rounded text-xs font-bold uppercase ${mode==='copy'?'bg-djcyan-600 text-white':'text-gray-500'}`}>Copiar</button>
                                    <button onClick={()=>setMode('move')} className={`px-4 py-1.5 rounded text-xs font-bold uppercase ${mode==='move'?'bg-amber-600 text-white':'text-gray-500'}`}>Mover</button>
                                </div>
                                <button className="bg-djgreen-600 text-black px-6 rounded-lg font-bold text-sm">Ejecutar Reglas</button>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 flex-1">
                            <div className="bg-djzinc-900 border-2 border-dashed border-djzinc-700 rounded-xl p-4 flex flex-col"><span className="text-xs font-bold text-djcyan-400 font-mono">PEAK TIME</span><div className="flex-1 flex items-center justify-center text-djzinc-700 text-xs mt-4">Drop Zone</div></div>
                            <div className="bg-djzinc-900 border-2 border-dashed border-djzinc-700 rounded-xl p-4 flex flex-col"><span className="text-xs font-bold text-djgreen-400 font-mono">RAW / DEEP</span><div className="flex-1 flex items-center justify-center text-djzinc-700 text-xs mt-4">Drop Zone</div></div>
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
