name: CleanDJmix CI - Cobertura y Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Clonar repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov shazamio librosa soundfile mutagen requests numpy

    - name: 🧪 Ejecutar Tests y Verificar Cobertura (Mínimo 80%)
      run: |
        PYTHONPATH=. pytest --cov=domain --cov=infrastructure --cov-fail-under=80 tests/
