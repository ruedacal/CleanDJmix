<div className="flex items-end h-[14px] ml-[7px] mb-[2px] gap-[2px] shrink-0 opacity-90">

        const AuditWorkspace = ({ selectedTrack, setSelectedTrack }) => {
            const dummyTracks = [
                { id: 1, f: "Pearl Jam - Pearl Jam.mp3", a: "Pearl Jam", d: "9:09", b: "120.00", k: "8A", e: 85, s: "ok" },
                { id: 2, f: "Techno Collective - Strobo.mp3", a: "Techno Collective", d: "6:02", b: "135.00", k: "5A", e: 95, s: "ok" },
                { id: 3, f: "Fentanyl Fantasy - Overdose.mp3", a: "Fentanyl Fantasy", d: "5:20", b: "140.00", k: "2B", e: null, s: "pending" },
                { id: 4, f: "David Bowie - DJ.mp3", a: "David Bowie", d: "7:02", b: "115.00", k: "9A", e: 60, s: "error" },

            const [isAuditing, setIsAuditing] = useState(false);
            const [metrics, setMetrics] = useState({ total: 0, missing: 0, ready: 0 });
            const [tracks, setTracks] = useState([]);

            const handleExplorar = async () => {
                if (window.eel) {
                    const nuevaRuta = await window.eel.seleccionar_directorio()();
                    if (nuevaRuta) { setRutaOrigen(nuevaRuta); setIsAuditing(true); setTracks([]); window.eel.iniciar_auditoria(nuevaRuta)().then(r => { setMetrics({total: r.total, missing: r.sin_meta, ready: r.total - r.sin_meta}); setTracks(r.tracks); setIsAuditing(false); }).catch(() => setIsAuditing(false)); }
                }
            };

            const handleAuditar = async () => {
                if (window.eel && !isAuditing) {
                    setIsAuditing(true);
                    setTracks([]); // Limpiamos para efecto de carga
                    
                    try {
                        const resultado = await window.eel.iniciar_auditoria(rutaOrigen)();
                        setMetrics({
                            total: resultado.total,
                            missing: resultado.sin_meta,
                            ready: resultado.total - resultado.sin_meta
                        });
                        if (resultado.tracks) {
                            setTracks(resultado.tracks);
                        }
                    } catch (err) {
                        console.error("Error conectando con Python:", err);
                    }
                    setIsAuditing(false);
                }
            };

       const SpotifyWorkspace = () => {

                    setTimeout(() => setDownloadProgress(0), 4000);
                };

                if (window.eel && typeof window.eel.expose === 'function') {
                    window.eel.expose(window.actualizar_estado_descarga, "actualizar_estado_descarga");
                    window.eel.expose(window.notificar_fin_lote, "notificar_fin_lote");
                }
            }, []);

            const handleElegirCarpeta = async () => {
                if (window.eel && window.eel.seleccionar_directorio_descarga) {
                    const res = await window.eel.seleccionar_directorio_descarga()();
                    if (res && res.status === 'ok' && res.path) {
                        setDestFolder(res.path);

                            setStatusText(`[DESTINO] Carpeta actualizada: ${res.path}`);

                }

            const [url, setUrl] = React.useState('https://open.spotify.com/intl-es/artist/23zJj2W0TQ0SvF4Fwo7mZK');
            const [statusText, setStatusText] = React.useState('Listo para analizar enlaces de Spotify (Tracks, Álbumes o Artistas).');
            const [isAnalyzing, setIsAnalyzing] = React.useState(false);
            const [isDownloading, setIsDownloading] = React.useState(false);
            const [tracks, setTracks] = React.useState([]);
            const [selectedTrackIds, setSelectedTrackIds] = React.useState(new Set());

                        const ICON_PLAY = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
            const ICON_PAUSE = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';

            React.useEffect(() => {
                if (!window.djAudioPlayer) {
                    window.djAudioPlayer = new Audio();
                    window.djAudioPlayer.crossOrigin = "anonymous";
                }
                const player = window.djAudioPlayer;

                // Única fuente de la verdad: los eventos reales del motor de audio actualizan tanto la lista (React) como la barra inferior (DOM)
                const syncPlayState = () => {
                    setIsPaused(false);
                    document.body.classList.remove('vu-paused');
                    const playBtn = document.getElementById('global-play-btn');
                    if (playBtn) playBtn.innerHTML = ICON_PAUSE;
                };

                const syncPauseState = () => {
                    setIsPaused(true);
                    document.body.classList.add('vu-paused');
                    const playBtn = document.getElementById('global-play-btn');
                    if (playBtn) playBtn.innerHTML = ICON_PLAY;
                };

                const syncEndedState = () => {
                    setIsPaused(true);
                    document.body.classList.add('vu-paused');
                    const playBtn = document.getElementById('global-play-btn');
                    if (playBtn) playBtn.innerHTML = ICON_PLAY;
                };

                player.addEventListener('play', syncPlayState);
                player.addEventListener('pause', syncPauseState);
                player.addEventListener('ended', syncEndedState);

                // Interceptar en fase CAPTURE para anular cualquier listener viejo de la barra inferior que cause conflicto
                const handleDeckCapture = (e) => {
                    const playBtn = e.target.closest('#global-play-btn');
                    const btnEl = e.target.closest('button');
                    const isCue = btnEl && btnEl.innerText.trim().toUpperCase() === 'CUE';

                    if (playBtn && player.src) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        if (player.paused) {
                            player.play();
                            setStatusText(`[REPRODUCIENDO] Pre-escucha activa.`);
                        } else {
                            player.pause();
                            setStatusText(`[PAUSADO] Pre-escucha en pausa.`);
                        }
                    } else if (isCue && player.src) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        player.pause();
                        player.currentTime = 0;
                        setStatusText('[CUE] Pista rebobinada al punto de inicio (0:00).');
                    }
                };

                // Usamos capture: true para adelantarnos a cualquier evento heredado del DOM
                document.addEventListener('click', handleDeckCapture, true);

                return () => {
                    player.removeEventListener('play', syncPlayState);
                    player.removeEventListener('pause', syncPauseState);
                    player.removeEventListener('ended', syncEndedState);
                    document.removeEventListener('click', handleDeckCapture, true);
                };
            }, []);

            const handleAnalizar = async () => {
                if (!url.trim()) return alert("Introduce una URL válida.");
                setIsAnalyzing(true);
                setStatusText("[ANALIZANDO] Extrayendo metadatos y portadas HD...");
                setTracks([]);
                setSelectedTrackIds(new Set());

                if (window.eel && window.eel.analizar_catalogo_spotify) {
                    try {
                        const res = await window.eel.analizar_catalogo_spotify(url)();
                        if (res && res.tracks) {
                            setTracks(res.tracks);
                            setSelectedTrackIds(new Set(res.tracks.map(t => t.id)));
                            setStatusText(`[ÉXITO] Catálogo cargado: ${res.tracks.length} pistas listas para pre-escucha instantánea.`);
                        }
                    } catch (e) {
                        setStatusText(`[ERROR] Fallo al analizar catálogo: ${e}`);
                    }
                } else {
                    setStatusText("[ERROR] Backend no responde.");
                }
                setIsAnalyzing(false);

            const handlePreescucha = async (t) => {
                const player = window.djAudioPlayer || (window.djAudioPlayer = new Audio());
                const playBtn = document.getElementById('global-play-btn');

                // Si pulsamos sobre la misma pista que ya está cargada, alternamos Play/Pause al instante
                if (playingTrackId === t.id && player.src) {
                    if (player.paused) {
                        player.play();
                        setIsPaused(false);
                        document.body.classList.remove('vu-paused');
                        if (playBtn) playBtn.innerHTML = ICON_PAUSE;
                        setStatusText(`[REPRODUCIENDO] ${t.artist} - ${t.title}`);
                    } else {
                        player.pause();
                        setIsPaused(true);
                        document.body.classList.add('vu-paused');
                        if (playBtn) playBtn.innerHTML = ICON_PLAY;
                        setStatusText(`[PAUSADO] ${t.artist} - ${t.title}`);
                    }
                    return;
                }

                // Actualizar el deck inferior inmediatamente
                const titleEl = document.getElementById('player-title');
                const artistEl = document.getElementById('player-artist');
                const bpmEl = document.getElementById('player-bpm');
                const keyEl = document.getElementById('player-key');
                const coverEl = document.getElementById('player-cover');

                if (titleEl) titleEl.innerText = t.title;
                if (artistEl) artistEl.innerText = t.artist;
                if (bpmEl) bpmEl.innerText = `${t.bpm || '--'} BPM`;
                if (keyEl) keyEl.innerText = t.key || '--';
                if (coverEl && t.cover) coverEl.src = t.cover;

                player.pause();
                setPlayingTrackId(t.id);

                // Si la pista ya trae su preview_url directo desde el análisis, reproduce en <100ms sin ir al backend
                if (t.preview_url) {
                    player.src = t.preview_url;
                    player.currentTime = 0;
                    player.play();
                    setIsPaused(false);
                    document.body.classList.remove('vu-paused');
                    if (playBtn) playBtn.innerHTML = ICON_PAUSE;
                    setStatusText(`[REPRODUCIENDO EN VIVO] ${t.artist} - ${t.title}`);
                    return;
                }

                setStatusText(`[PRE-ESCUCHA] Cargando stream: ${t.artist} - ${t.title}...`);
                if (window.eel && window.eel.resolver_stream_preescucha) {
                    const res = await window.eel.resolver_stream_preescucha(t.title, t.artist)();

                        if (playBtn) playBtn.innerHTML = ICON_PAUSE;

                    } else {
                        setStatusText("[ERROR] Stream no disponible para esta pista.");

                        <div className="flex-1 flex gap-3 max-w-2xl min-w-[320px]">
                            <div className="flex-1 bg-djzinc-900 rounded-md border border-djzinc-700 flex focus-within:border-djcyan-500 overflow-hidden">
                                <span className="bg-djzinc-800 px-3 py-1.5 text-xs text-djcyan-400 font-mono border-r border-djzinc-700 flex items-center">SPOTIFY</span>
                                <input 
                                    type="text" 
                                    value={url}
                                    onChange={(e) => setUrl(e.target.value)}
                                    placeholder="URL de Álbum, Artista o Playlist..." 
                                    className="flex-1 bg-transparent px-3 py-1.5 text-sm text-gray-200 outline-none font-mono" 
                                />
                            </div>
                            
                            <button 
                                onClick={handleAnalizar}
                                disabled={isAnalyzing}
                                className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded px-5 py-1.5 text-xs font-bold text-white transition-colors cursor-pointer disabled:opacity-50"
                            >
                                {isAnalyzing ? 'Analizando...' : 'Analizar Enlace'}
                            </button>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={handleElegirCarpeta}
                                    className="bg-djzinc-900 hover:bg-djzinc-800 border border-djzinc-700 hover:border-djcyan-500 rounded px-3 py-1.5 text-xs text-gray-300 flex items-center gap-2 transition-colors cursor-pointer"
                                    title="Cambiar carpeta de destino"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                    <span className="truncate max-w-[150px] font-mono text-[11px] text-djcyan-400">{destFolder.split('/').pop() || 'Destino'}</span>
                                </button>
                            </div>
                            <div className="flex items-center gap-2 bg-djzinc-900 border border-djzinc-800 rounded px-3 py-1">
                                <span className="text-[10px] text-gray-400 uppercase font-mono font-bold">Formato:</span>
                                <select 
                                    value={selectedFormat} 
                                    onChange={(e) => setSelectedFormat(e.target.value)}
                                    className="bg-transparent text-xs text-djcyan-400 font-bold outline-none cursor-pointer"
                                >
                                    <option value="flac" className="bg-djzinc-900 text-white">FLAC Lossless (16-bit / 44.1k)</option>
                                    <option value="flac_hires" className="bg-djzinc-900 text-djcyan-300 font-bold">FLAC Hi-Res (24-bit / 48k)</option>
                                    <option value="wav" className="bg-djzinc-900 text-white">WAV (Master)</option>
                                    <option value="mp3" className="bg-djzinc-900 text-white">MP3 (320k)</option>
                                    <option value="aiff" className="bg-djzinc-900 text-white">AIFF (Apple Lossless)</option>
                                </select>
                            </div>

                            <button 
                                onClick={() => handleDescargar(tracks.filter(t => selectedTrackIds.has(t.id)))}
                                disabled={isDownloading || selectedTrackIds.size === 0}
                                className="bg-djcyan-600 hover:bg-djcyan-500 text-white px-4 py-2 rounded-md font-bold text-xs shadow-[0_4px_14px_0_rgba(8,145,178,0.39)] transition-all cursor-pointer disabled:opacity-50"
                            >
                                Descargar Seleccionadas ({selectedTrackIds.size})
                            </button>

                            <button 
                                onClick={() => handleDescargar(tracks)}
                                disabled={isDownloading || tracks.length === 0}
                                className="bg-djgreen-600 hover:bg-djgreen-500 text-black px-4 py-2 rounded-md font-bold text-xs shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] transition-all cursor-pointer disabled:opacity-50"
                            >
                                Descargar Todo ({tracks.length})
                            </button>
                        </div>
                    </div>

                                        {/* Franja de Estado y Barra de Progreso Dinámica */}
                    <div className="bg-djzinc-900 border-b border-djzinc-800 px-4 py-2.5 flex flex-col gap-2 shrink-0">
                        <div className="flex justify-between items-center text-xs font-mono">
                            <span className="text-djcyan-400 font-semibold">{statusText || "Listo para analizar catálogo"}</span>
                            {isDownloading && (
                                <span className="text-gray-400 font-bold">{downloadProgress}%</span>
                            )}
                        </div>
                        
                        {downloadProgress > 0 && (
                            <div className="w-full bg-djzinc-950 h-2 rounded-full overflow-hidden border border-djzinc-800 shadow-inner">
                                <div 
                                    className="bg-djcyan-500 h-full transition-all duration-300 ease-out shadow-lg shadow-djcyan-500/50" 
                                    style={{ width: `${downloadProgress}%` }}
                                ></div>
                            </div>
                        )}
                    </div>


                    <div className="flex-1 overflow-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap border-collapse">
                            <thead className="sticky top-0 bg-djzinc-900 border-b border-djzinc-700 text-[11px] text-gray-400 uppercase tracking-wider font-bold z-10 shadow-md">
                                <tr>
                                    <th className="py-3 px-4 w-10 text-center"><input type="checkbox" checked={tracks.length > 0 && selectedTrackIds.size === tracks.length} onChange={toggleSelectAll} className="rounded accent-djcyan-500 cursor-pointer" /></th>
                                    <th className="py-3 px-4 w-12 text-center">Play</th>
                                    <th className="py-3 px-4">Título / Álbum</th>
                                    <th className="py-3 px-4">Artista</th>
                                    <th className="py-3 px-4 w-20">Duración</th>
                                    <th className="py-3 px-4 w-24">BPM Est.</th>
                                    <th className="py-3 px-4 w-24">Key Est.</th>
                                    <th className="py-3 px-4 w-32 text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-djzinc-800/50">
                                {tracks.length === 0 && !isAnalyzing && (
                                    <tr><td colSpan="8" className="py-16 text-center text-gray-500 text-sm">Pega una URL de Spotify arriba y haz clic en "Analizar Enlace".</td></tr>
                                )}
                                {tracks.map((t) => {
                                    const isChecked = selectedTrackIds.has(t.id);
                                    const isCurrentPlaying = playingTrackId === t.id && !isPaused;
                                    return (
                                        <tr key={t.id} className={`hover:bg-djzinc-800/50 transition-colors ${isChecked ? 'bg-djzinc-900/40' : ''}`}>
                                            <td className="py-2 px-4 text-center"><input type="checkbox" checked={isChecked} onChange={() => toggleSelectTrack(t.id)} className="rounded accent-djcyan-500 cursor-pointer" /></td>
                                            <td className="py-2 px-4 text-center">
                                                <button 
                                                    onClick={() => handlePreescucha(t)} 
                                                    className={`w-8 h-8 rounded-full flex items-center justify-center text-xs transition-colors cursor-pointer ${isCurrentPlaying ? 'bg-djcyan-500 text-black font-bold' : 'bg-djzinc-800 hover:bg-djcyan-500 hover:text-black text-gray-300'}`}
                                                >
                                                    {isCurrentPlaying ? '❚❚' : '▶'}
                                                </button>
                                            </td>
                                            <td className="py-2 px-4 flex items-center gap-3">
                                                <img src={t.cover} className="w-9 h-9 rounded bg-djzinc-800 object-cover shrink-0 border border-djzinc-700" alt="cover" />
                                                <div className="flex flex-col text-left">
                                                    <span className="font-medium text-gray-200 truncate w-72">{t.title}</span>
                                                    <span className="text-[10px] text-gray-500 font-mono truncate w-72">{t.album}</span>
                                                </div>
                                            </td>
                                            <td className="py-2 px-4 text-gray-300">{t.artist}</td>
                                            <td className="py-2 px-4 text-gray-400 font-mono text-xs">{t.duration}</td>
                                            <td className="py-2 px-4"><span className="bg-djzinc-800 text-gray-300 px-2 py-1 rounded text-xs font-mono">{t.bpm}</span></td>
                                            <td className="py-2 px-4"><span className="px-2 py-1 rounded text-xs font-mono font-bold bg-djcyan-900/30 text-djcyan-400">{t.key}</span></td>
                                            <td className="py-2 px-4 text-center">
                                                <button onClick={() => handleDescargar([t])} disabled={isDownloading} className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 text-xs px-3 py-1 rounded font-medium text-white cursor-pointer">Descargar .{selectedFormat}</button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const TaxonomyWorkspace = () => (
            <div className="flex flex-col h-full p-6 w-full">
                <div className="mb-6 flex justify-between items-end border-b border-djzinc-800 pb-4">
                    <div>
                        <h2 className="text-xl font-bold text-white mb-1">Ruteo de Destinos (Serato Crates)</h2>
                        <p className="text-gray-400 text-sm">Define dónde se guardan los archivos físicos basándose en su género principal.</p>
                    </div>
                    <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 text-white px-4 py-2 rounded text-sm font-medium">Añadir Nueva Regla</button>
                </div>
                
                <div className="flex-1 overflow-auto">
                    <div className="bg-djzinc-900 border border-djzinc-700 rounded-xl mb-6 shadow-lg overflow-hidden">
                        <div className="bg-gradient-to-r from-djzinc-800 to-djzinc-900 px-5 py-3 border-b border-djzinc-700 flex items-center gap-3">
                            <div className="w-3 h-3 rounded-full bg-djcyan-500 shadow-[0_0_8px_#06b6d4]"></div>
                            <h3 className="font-bold text-white tracking-wide">TECHNO <span className="font-normal text-gray-500 text-xs ml-2">(Raíz Serato)</span></h3>
                        </div>
                        <div className="p-2">
                            {['Hard Techno', 'Melodic Techno', 'Peak Time'].map(sub => (
                                <div key={sub} className="flex gap-4 items-center p-3 hover:bg-djzinc-800/50 rounded-lg group transition-colors">
                                    <div className="w-6 h-6 border-l-2 border-b-2 border-djzinc-700 rounded-bl-lg ml-2 opacity-50"></div>
                                    <div className="w-32 text-sm font-bold text-gray-300">{sub}</div>
                                    <div className="flex-1 flex items-center gap-2">
                                        <span className="text-xs text-gray-600 uppercase font-mono">➡ Ruta Fija:</span>
                                        <input type="text" defaultValue={`/Music/Serato/Techno/${sub}/`} className="flex-1 bg-djzinc-950 border border-djzinc-800 rounded px-3 py-2 text-xs font-mono text-gray-400 focus:border-djcyan-500 outline-none transition-colors" />
                                        <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded p-2 text-gray-400"><Icons.Routing /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        const LogsWorkspace = ({ logs, setLogs }) => (
            <div className="flex flex-col h-full p-6 w-full bg-black">
                <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                        <Icons.Terminal />
                        <h2 className="text-sm font-bold text-gray-400 font-mono tracking-widest uppercase">System Console</h2>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setLogs([])} className="text-xs text-djcyan-400 hover:text-white transition-colors font-mono">[ Clear ]</button>
                        <button className="text-xs text-gray-500 hover:text-white transition-colors font-mono">[ Export .log ]</button>
                    </div>
                </div>
                
                <div className="flex-1 border border-djzinc-800 rounded p-4 font-mono text-sm overflow-auto flex flex-col-reverse shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
                    <div>
                        {logs.map((log, idx) => (
                            <div key={idx} className={`mb-1 ${
                                log.type === 'info' ? 'text-djcyan-500' : 
                                log.type === 'divider' ? 'text-gray-500 mb-2' : 
                                log.type === 'success' ? 'text-djgreen-400' : 
                                log.type === 'warn' ? 'text-amber-400' : 
                                'text-gray-300'
                            }`}>
                                {log.text}
                            </div>
                        ))}
                        <div className="flex items-center gap-2 mt-2">
                            <span className="w-2 h-4 bg-djcyan-400 animate-pulse"></span>
                        </div>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>


</body>

</html>

<!-- INYECCIÓN: Motor de Audio, CUE, Inspector y Vúmetro Animado -->
<style>
    @keyframes miniEq {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1.0); }
    }
    .logo-bar {
        transform-origin: bottom;
        animation-name: miniEq;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
    }

    @keyframes equalize {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1.0); }
    }
    .vu-meter-bar {
        transform-origin: bottom;
        animation-name: equalize;
        animation-iteration-count: infinite;
    }
    .vu-paused .vu-meter-bar {
        animation-play-state: paused !important;
        transform: scaleY(0.1) !important;
        background-color: #3f3f46 !important;
        transition: transform 0.3s ease, background-color 0.3s ease;
    }
</style>
<script>
    document.body.classList.add('vu-paused'); 
    let pistaActual = null;
    let estaReproduciendo = false;

    function controlarReproduccion(estado, nombreArchivo = null) {
        const btnPlay = document.getElementById('global-play-btn');
        if (estado) {
            window.eel.reproducir_pista_mac(nombreArchivo)();
            pistaActual = nombreArchivo;
            estaReproduciendo = true;
            document.body.classList.remove('vu-paused');
            if(btnPlay) btnPlay.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
        } else {
            window.eel.detener_audio_mac()();
            estaReproduciendo = false;
            document.body.classList.add('vu-paused');
            if(btnPlay) btnPlay.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
        }
    }

    document.addEventListener('click', (e) => {
        const btnCue = e.target.closest('#global-cue-btn');
        if (btnCue && window.eel && pistaActual) {
            window.eel.detener_audio_mac()();
            setTimeout(() => window.eel.reproducir_pista_mac(pistaActual)(), 50);
            if (!estaReproduciendo) controlarReproduccion(true, pistaActual);
            return;
        }

        const btnFooter = e.target.closest('#global-play-btn');
        if (btnFooter && window.eel && pistaActual) {
            controlarReproduccion(!estaReproduciendo, pistaActual);
            return;
        }

        const tr = e.target.closest('tr');
        if (tr && window.eel) {
            const filenameDiv = tr.querySelector('.font-mono');
            if (filenameDiv) {
                const nombreArchivo = filenameDiv.innerText.trim();
                
                if (pistaActual === nombreArchivo && estaReproduciendo) {
                    controlarReproduccion(false);
                } else {
                    const tds = tr.querySelectorAll('td');
                    const tituloEl = tr.querySelector('.font-medium');
                    const rowImg = tr.querySelector('img');
                    
                    document.getElementById('player-title').innerText = tituloEl ? tituloEl.innerText : nombreArchivo;
                    document.getElementById('player-artist').innerText = tds[2] ? tds[2].innerText : 'Desconocido';
                    document.getElementById('player-bpm').innerText = (tds[4] ? tds[4].innerText : '--') + ' BPM';
                    document.getElementById('player-key').innerText = tds[5] ? tds[5].innerText : '--';
                    
                    if(rowImg) {
                        const imgSrc = rowImg.src;
                        document.getElementById('player-cover').src = imgSrc;
                        
                        // LÓGICA CSS PERFECTA PARA EL INSPECTOR
                        const inspectorBadges = Array.from(document.querySelectorAll('div, span')).filter(el => el.textContent.trim() === 'ID3v2.4');
                        if(inspectorBadges.length > 0) {
                            const badge = inspectorBadges[0];
                            // Encontramos el recuadro negro que envuelve al badge
                            const coverContainer = badge.closest('.relative') || badge.parentElement;
                            
                            // Ocultamos el icono cuadriculado central
                            const svgIcon = coverContainer.querySelector('svg');
                            if (svgIcon) svgIcon.style.display = 'none';

                            // Pintamos la imagen como fondo CSS. Esto garantiza que respete el tamaño, 
                            // los bordes redondeados y NUNCA tape a la etiqueta ID3v2.4.
                            coverContainer.style.backgroundImage = `url("${imgSrc}")`;
                            coverContainer.style.backgroundSize = 'cover';
                            coverContainer.style.backgroundPosition = 'center';
                            coverContainer.style.backgroundRepeat = 'no-repeat';
                            
                            // Eliminamos cualquier imagen residual de intentos anteriores
                            const viejaImg = document.getElementById('dynamic-inspector-cover');
                            if (viejaImg) viejaImg.remove();
                        }
                    }
                    controlarReproduccion(true, nombreArchivo);
                }
            }
        }
    });
</script>


</body>
