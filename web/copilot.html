<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BEATWAVE LIVE COPILOT — Monitor Táctico de Cabina DJ</title>
    <script type="text/javascript" src="/eel.js" onerror="console.log('Eel no disponible, usando API REST')"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/beatwave.css">
    <style>
        body {
            background-color: #040407;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-syne { font-family: 'Syne', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        @keyframes pulse-danger {
            0%, 100% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2); }
            50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 8px rgba(239, 68, 68, 0.1); }
        }
        .animate-danger-pulse {
            animation: pulse-danger 1.8s infinite ease-in-out;
        }
        @keyframes pulse-warning {
            0%, 100% { border-color: rgba(245, 158, 11, 0.8); box-shadow: 0 0 20px rgba(245, 158, 11, 0.35), inset 0 0 12px rgba(245, 158, 11, 0.15); }
            50% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 6px rgba(245, 158, 11, 0.1); }
        }
        .animate-warning-pulse {
            animation: pulse-warning 2.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#040407] text-gray-200 antialiased min-h-screen">
    <div id="copilot-root"></div>
    <script src="/js/copilot.bundle.js"></script>
</body>
</html>
