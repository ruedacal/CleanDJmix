<body class="bg-djzinc-950 text-gray-300 h-screen w-screen overflow-hidden antialiased selection:bg-djcyan-500 selection:text-white font-sans">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const NV2_COLORS = [
            { id: 1, name: "Kick / Intro", color: "#ef4444", text: "text-red-400", border: "border-red-500/50", bg: "bg-red-500/10", time: "00:00.215" },
            { id: 2, name: "Hi-Hats In", color: "#f97316", text: "text-orange-400", border: "border-orange-500/50", bg: "bg-orange-500/10", time: "00:15.110" },
            { id: 3, name: "Bassline", color: "#eab308", text: "text-yellow-400", border: "border-yellow-500/50", bg: "bg-yellow-500/10", time: "00:30.005" },
            { id: 4, name: "Main Break", color: "#22c55e", text: "text-green-400", border: "border-green-500/50", bg: "bg-green-500/10", time: "01:00.120" },
            { id: 5, name: "Drop 1 (Climax)", color: "#06b6d4", text: "text-cyan-400", border: "border-cyan-500/50", bg: "bg-cyan-500/10", time: "01:30.240" },
            { id: 6, name: "Mid Break", color: "#3b82f6", text: "text-blue-400", border: "border-blue-500/50", bg: "bg-blue-500/10", time: "02:30.400" },
            { id: 7, name: "Drop 2 (Re-Kick)", color: "#a855f7", text: "text-purple-400", border: "border-purple-500/50", bg: "bg-purple-500/10", time: "03:00.510" },
            { id: 8, name: "Outro Mix Point", color: "#ec4899", text: "text-pink-400", border: "border-pink-500/50", bg: "bg-pink-500/10", time: "04:15.000" }
        ];

        const Icons = {
            Library: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            Spotify: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.524 4.477 10 10 10s10-4.476 10-10c0-5.523-4.477-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.435-5.308-1.76-8.792-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.506 9.72 1.113.295.18.388.563.208.857zm1.225-2.723c-.226.367-.708.482-1.075.257-2.69-1.653-6.79-2.132-9.97-1.167-.413.125-.85-.108-.975-.521-.125-.413.108-.85.521-.975 3.633-1.102 8.147-.568 11.242 1.33.367.226.482.708.257 1.076zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.018-.13-1.168-.624-.15-.495.13-1.018.624-1.168 3.532-1.072 9.404-.866 13.115 1.337.445.264.59.838.327 1.282-.264.444-.838.59-1.282.327z"/></svg>,
            Routing: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            Terminal: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            Sliders: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>,
            Gear: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        };

        const InfoTip = ({ text, title }) => {
            const [coords, setCoords] = useState(null);
            const btnRef = useRef(null);

            const handleEnter = () => {
                if (!btnRef.current) return;
                const rect = btnRef.current.getBoundingClientRect();
                setCoords({
                    top: rect.top + rect.height / 2,
                    right: window.innerWidth - rect.left + 12
                });
            };

            const handleLeave = () => setCoords(null);

            return (
                <span className="inline-flex items-center ml-1.5 align-middle">
                    <button 
                        ref={btnRef}
                        type="button"
                        onMouseEnter={handleEnter}
                        onMouseLeave={handleLeave}
                        onClick={(e) => { e.stopPropagation(); coords ? handleLeave() : handleEnter(); }}
                        className="w-3.5 h-3.5 rounded-full bg-djzinc-800 hover:bg-djcyan-500 hover:text-black border border-djzinc-600 flex items-center justify-center text-[9px] font-mono font-bold text-gray-400 transition-colors cursor-help select-none shrink-0"
                    >
                        i
                    </button>

                    {coords && (
                        <div 
                            style={{ 
                                position: 'fixed', 
                                top: `${coords.top}px`, 
                                right: `${coords.right}px`, 
                                transform: 'translateY(-50%)',
                                zIndex: 999999
                            }}
                            className="w-72 bg-djzinc-900 border border-djzinc-700 rounded-lg p-3 text-xs text-gray-200 shadow-[0_12px_36px_rgba(0,0,0,0.95),0_0_15px_rgba(6,182,212,0.2)] pointer-events-none select-none"
                        >
                            <div className="absolute top-1/2 -right-1 -translate-y-1/2 w-2 h-2 bg-djzinc-900 border-t border-r border-djzinc-700 rotate-45"></div>
                            {title && (
                                <div className="text-[11px] font-bold text-djcyan-400 mb-1 uppercase tracking-wider flex items-center gap-1.5 border-b border-djzinc-800 pb-1">
                                    <span className="w-1.5 h-1.5 rounded-full bg-djcyan-400"></span>
                                    {title}
                                </div>
                            )}
                            <div className="text-[11px] leading-relaxed text-gray-300 font-sans break-words whitespace-normal">
                                {text}
                            </div>
                        </div>
                    )}
                </span>
            );
        };

        // --- MINI WAVEFORM HARMONIC 3-BAND REKORDBOX PARA LA TABLA ---
        const TableHarmonicWaveform = ({ track, duration = "05:00", onPlayTrack, isCurrentPlaying }) => {
            const canvasRef = useRef(null);
            const seed = (track && track.id) ? Number(track.id) : 1;

            const handleClickScrub = (e) => {
                e.stopPropagation();
                if (!canvasRef.current || !onPlayTrack) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const pct = Math.max(0, Math.min(1, clickX / rect.width));
                onPlayTrack(track, pct, true);
            };

            const handleMouseEnter = () => {
                if (onPlayTrack) {
                    onPlayTrack(track, 0, false);
                }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const dpr = window.devicePixelRatio || 1;
                const width = 112;
                const height = 28;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);

                ctx.fillStyle = "#040407";
                ctx.fillRect(0, 0, width, height);

                const centerY = height / 2;

                const getBandEnergy = (xNorm) => {
                    let bass = 0.3, mid = 0.2, treble = 0.25;
                    if (xNorm > 0.12 && xNorm < 0.40) {
                        bass = 0.95; mid = 0.75; treble = 0.70;
                    } else if (xNorm >= 0.40 && xNorm <= 0.55) {
                        bass = 0.15; mid = 0.85; treble = 0.50;
                    } else if (xNorm > 0.55 && xNorm < 0.85) {
                        bass = 1.00; mid = 0.80; treble = 0.85;
                    } else if (xNorm >= 0.85) {
                        bass = 0.40; mid = 0.20; treble = 0.30;
                    }
                    return { bass, mid, treble };
                };

                // Low / Bass (Azul)
                ctx.beginPath();
                ctx.fillStyle = "rgba(30, 64, 175, 0.75)";
                for (let x = 0; x <= width; x += 2) {
                    const { bass } = getBandEnergy(x / width);
                    const kickPound = (Math.sin(x * 0.45 + seed) > 0.3) ? 1.2 : 0.8;
                    const yH = (height * 0.38) * bass * kickPound;
                    if (x === 0) ctx.moveTo(x, centerY - yH);
                    else ctx.lineTo(x, centerY - yH);
                }
                for (let x = width; x >= 0; x -= 2) {
                    const { bass } = getBandEnergy(x / width);
                    const kickPound = (Math.sin(x * 0.45 + seed) > 0.3) ? 1.2 : 0.8;
                    const yH = (height * 0.38) * bass * kickPound;
                    ctx.lineTo(x, centerY + yH);
                }
                ctx.closePath();
                ctx.fill();

                // Mid / Vocals (Ámbar)
                ctx.beginPath();
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 1.2;
                for (let x = 0; x <= width; x += 2) {
                    const { mid } = getBandEnergy(x / width);
                    const yMid = centerY - Math.sin(x * 0.18 + seed * 2) * (height * 0.32) * mid;
                    if (x === 0) ctx.moveTo(x, yMid);
                    else ctx.lineTo(x, yMid);
                }
                ctx.stroke();

                // Treble (Cian)
                ctx.beginPath();
                ctx.strokeStyle = "#22d3ee";
                ctx.lineWidth = 0.9;
                for (let x = 0; x <= width; x += 1.5) {
                    const { treble } = getBandEnergy(x / width);
                    const yHi = centerY - Math.sin(x * 0.38 + seed * 3) * (height * 0.44) * treble;
                    if (x === 0) ctx.moveTo(x, yHi);
                    else ctx.lineTo(x, yHi);
                }
                ctx.stroke();

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(width, centerY);
                ctx.stroke();
            }, [seed, track]);

            return (
                <div 
                    onClick={handleClickScrub}
                    onMouseEnter={handleMouseEnter}
                    className={`w-28 h-7 bg-[#040407] rounded-md border relative overflow-hidden group cursor-pointer transition-all flex items-center shadow-[inset_0_1px_4px_rgba(0,0,0,0.9)] ${
                        isCurrentPlaying ? 'border-djcyan-400 ring-1 ring-djcyan-400/50 shadow-[0_0_8px_rgba(6,182,212,0.3)]' : 'border-djzinc-800 hover:border-djcyan-500/80'
                    }`}
                >
                    <canvas ref={canvasRef} style={{ width: '112px', height: '28px', display: 'block' }} />
                    <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 backdrop-blur-[1px] flex items-center justify-between px-2 transition-opacity z-20">
                        <span className="text-[9px] font-mono font-bold text-djcyan-400 flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-djcyan-400 animate-ping"></span>
                            SCRUB
                        </span>
                        <span className="text-[9px] font-mono text-gray-300 font-bold">{duration}</span>
                    </div>
                </div>
            );
        };

        // --- MASTER WAVEFORM REKORDBOX 3-BAND HARMONIC HD (INSPECTOR LATERAL) ---
        const RekordboxWaveform = ({ track, cues = NV2_COLORS, duration = "06:12" }) => {
            const canvasRef = useRef(null);
            const seed = (track && track.id) ? Number(track.id) : 1;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;

                const dpr = window.devicePixelRatio || 1;
                const width = canvas.parentElement.clientWidth || 340;
                const height = 114;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);

                let phase = 0;

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = "#040407";
                    ctx.fillRect(0, 0, width, height);

                    const centerY = height / 2;

                    const getProfile = (xNorm) => {
                        let b = 0.25, m = 0.20, t = 0.25;
                        if (xNorm > 0.12 && xNorm < 0.40) {
                            b = 0.95; m = 0.70; t = 0.80;
                        } else if (xNorm >= 0.40 && xNorm <= 0.56) {
                            b = 0.15; m = 0.92; t = 0.45;
                        } else if (xNorm > 0.56 && xNorm < 0.86) {
                            b = 1.00; m = 0.85; t = 0.90;
                        } else if (xNorm >= 0.86) {
                            b = 0.35; m = 0.20; t = 0.25;
                        }
                        return { b, m, t };
                    };

                    // Rejilla Beatgrid
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                    ctx.lineWidth = 1;
                    for (let x = 0; x < width; x += 18) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }

                    // Low / Bass
                    ctx.beginPath();
                    ctx.fillStyle = "rgba(29, 78, 216, 0.50)";
                    for (let x = 0; x <= width; x += 3) {
                        const { b } = getProfile(x / width);
                        const kickBeat = (Math.sin(x * 0.15 + phase * 0.03 + seed) > 0.4) ? 1.15 : 0.85;
                        const yH = (height * 0.40) * b * kickBeat;
                        if (x === 0) ctx.moveTo(x, centerY - yH);
                        else ctx.lineTo(x, centerY - yH);
                    }
                    for (let x = width; x >= 0; x -= 3) {
                        const { b } = getProfile(x / width);
                        const kickBeat = (Math.sin(x * 0.15 + phase * 0.03 + seed) > 0.4) ? 1.15 : 0.85;
                        const yH = (height * 0.40) * b * kickBeat;
                        ctx.lineTo(x, centerY + yH);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Mid / Lead
                    const midLines = [
                        { color: "rgba(249, 115, 22, 0.85)", speed: 0.03, freq: 0.06, amp: 0.32, w: 1.5 },
                        { color: "rgba(244, 63, 94, 0.70)", speed: 0.02, freq: 0.08, amp: 0.28, w: 1.2 }
                    ];

                    midLines.forEach((ml, idx) => {
                        ctx.beginPath();
                        ctx.strokeStyle = ml.color;
                        ctx.lineWidth = ml.w;
                        for (let x = 0; x <= width; x += 2.5) {
                            const { m } = getProfile(x / width);
                            const y = centerY + Math.sin(x * ml.freq + phase * ml.speed + idx + seed) * (height * ml.amp) * m;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    });

                    // Treble / Hats
                    ctx.beginPath();
                    ctx.strokeStyle = "#06b6d4";
                    ctx.lineWidth = 1.4;
                    for (let x = 0; x <= width; x += 2) {
                        const { t } = getProfile(x / width);
                        const yHi = centerY - Math.sin(x * 0.12 + phase * 0.06 + seed) * (height * 0.44) * t;
                        if (x === 0) ctx.moveTo(x, yHi);
                        else ctx.lineTo(x, yHi);
                    }
                    ctx.stroke();

                    // Eje Cero
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.20)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, centerY);
                    ctx.lineTo(width, centerY);
                    ctx.stroke();

                    // Playhead
                    const px = width * 0.22;
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, height);
                    ctx.stroke();

                    phase += 1;
                    animationId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animationId);
            }, [seed, track]);

            return (
                <div className="flex flex-col gap-1.5 w-full bg-[#050508] p-3 rounded-xl border border-djzinc-800 shadow-2xl relative">
                    <div className="flex justify-between items-center text-[10px] font-mono px-0.5">
                        <span className="text-djcyan-400 font-bold flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-djcyan-400 animate-pulse"></span>
                            REKORDBOX 3-BAND SPECTRUM
                        </span>
                        <span className="text-gray-400 font-bold">{duration}</span>
                    </div>

                    <div className="relative w-full rounded-lg overflow-hidden border border-djzinc-800/90 shadow-[inset_0_2px_12px_rgba(0,0,0,0.95)]">
                        <canvas ref={canvasRef} style={{ width: '100%', height: '114px', display: 'block' }} />

                        {cues.map((cue, idx) => {
                            const leftPos = Math.min(94, Math.max(4, (idx * 12.2) + 3));
                            return (
                                <div key={cue.id} className="absolute top-0 bottom-0 flex flex-col items-center pointer-events-none z-20" style={{ left: `${leftPos}%` }}>
                                    <div className="w-3.5 h-3.5 rounded-b text-[8px] font-mono font-black text-black flex items-center justify-center shadow-lg" style={{ backgroundColor: cue.color }}>
                                        {cue.id}
                                    </div>
                                    <div className="w-[1px] h-full opacity-60" style={{ backgroundColor: cue.color }}></div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="flex justify-between items-center text-[9px] font-mono pt-0.5 px-0.5">
                        <span className="text-gray-500">00:00.000</span>
                        <div className="flex gap-3">
                            <span className="text-blue-400 font-bold flex items-center gap-1"><span className="w-2 h-2 rounded bg-blue-600"></span> LOW</span>
                            <span className="text-orange-400 font-bold flex items-center gap-1"><span className="w-2 h-2 rounded bg-orange-500"></span> MID</span>
                            <span className="text-cyan-300 font-bold flex items-center gap-1"><span className="w-2 h-2 rounded bg-cyan-400"></span> HI</span>
                        </div>
                        <span className="text-gray-500">FIN</span>
                    </div>
                </div>
            );
        };

        // --- MASTER DECK WAVEFORM EN EL FOOTER (PANORÁMICO CON SCRUB Y 8 HOT CUES) ---
        const FooterMasterWaveform = ({ track, isPlaying, playProgress = 0.22, onSeek, cues = NV2_COLORS }) => {
            const canvasRef = useRef(null);
            const seed = (track && track.id) ? Number(track.id) : 1;

            const handleScrub = (e) => {
                if (!canvasRef.current || !onSeek) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const pct = Math.max(0, Math.min(1, clickX / rect.width));
                onSeek(pct);
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;

                const dpr = window.devicePixelRatio || 1;
                const width = canvas.parentElement.clientWidth || 600;
                const height = 44;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);

                let phase = 0;

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = "#07070a";
                    ctx.fillRect(0, 0, width, height);

                    const centerY = height / 2;

                    const getProfile = (xNorm) => {
                        let b = 0.25, m = 0.20, t = 0.20;
                        if (xNorm > 0.12 && xNorm < 0.40) {
                            b = 0.95; m = 0.70; t = 0.75;
                        } else if (xNorm >= 0.40 && xNorm <= 0.55) {
                            b = 0.15; m = 0.90; t = 0.40;
                        } else if (xNorm > 0.55 && xNorm < 0.85) {
                            b = 1.00; m = 0.85; t = 0.85;
                        } else if (xNorm >= 0.85) {
                            b = 0.35; m = 0.20; t = 0.25;
                        }
                        return { b, m, t };
                    };

                    // Rejilla de compases vertical
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
                    ctx.lineWidth = 1;
                    for (let x = 0; x < width; x += 24) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }

                    // Low / Bass (Azul sólido)
                    ctx.beginPath();
                    ctx.fillStyle = "rgba(30, 64, 175, 0.65)";
                    for (let x = 0; x <= width; x += 4) {
                        const { b } = getProfile(x / width);
                        const kickBeat = (isPlaying && Math.sin(x * 0.10 + phase * 0.04 + seed) > 0.3) ? 1.15 : 0.85;
                        const yH = (height * 0.40) * b * kickBeat;
                        if (x === 0) ctx.moveTo(x, centerY - yH);
                        else ctx.lineTo(x, centerY - yH);
                    }
                    for (let x = width; x >= 0; x -= 4) {
                        const { b } = getProfile(x / width);
                        const kickBeat = (isPlaying && Math.sin(x * 0.10 + phase * 0.04 + seed) > 0.3) ? 1.15 : 0.85;
                        const yH = (height * 0.40) * b * kickBeat;
                        ctx.lineTo(x, centerY + yH);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Mid / Melody (Naranja)
                    ctx.beginPath();
                    ctx.strokeStyle = "#f97316";
                    ctx.lineWidth = 1.2;
                    for (let x = 0; x <= width; x += 3) {
                        const { m } = getProfile(x / width);
                        const yMid = centerY - Math.sin(x * 0.05 + phase * 0.03 + seed) * (height * 0.32) * m;
                        if (x === 0) ctx.moveTo(x, yMid);
                        else ctx.lineTo(x, yMid);
                    }
                    ctx.stroke();

                    // Treble (Cian)
                    ctx.beginPath();
                    ctx.strokeStyle = "#22d3ee";
                    ctx.lineWidth = 1.0;
                    for (let x = 0; x <= width; x += 2.5) {
                        const { t } = getProfile(x / width);
                        const yHi = centerY - Math.sin(x * 0.10 + phase * 0.05 + seed) * (height * 0.44) * t;
                        if (x === 0) ctx.moveTo(x, yHi);
                        else ctx.lineTo(x, yHi);
                    }
                    ctx.stroke();

                    // Eje Central
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, centerY);
                    ctx.lineTo(width, centerY);
                    ctx.stroke();

                    // Playhead interactivo
                    const px = width * playProgress;
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = "#22d3ee";
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, height);
                    ctx.stroke();

                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.moveTo(px - 4, 0);
                    ctx.lineTo(px + 4, 0);
                    ctx.lineTo(px, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (isPlaying) phase += 1;
                    animationId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animationId);
            }, [track, isPlaying, playProgress]);

            return (

                    onClick={handleScrub}
                    className="flex-1 h-11 bg-[#060609] rounded-lg border border-djzinc-800/90 relative overflow-hidden group cursor-pointer hover:border-djcyan-500/70 transition-colors shadow-inner flex items-center mx-4"

                                <div 
                                    className="w-3.5 h-3 rounded-b text-[8px] font-mono font-black text-black flex items-center justify-center shadow"

                                </div>
                                <div className="w-[1px] h-full opacity-50" style={{ backgroundColor: cue.color }}></div>
                            </div>
                        );
                    })}
                </div>
            );

                        <p className="text-gray-400 text-sm">Define dónde se guardan los archivos físicos basándose en su género principal.</p>
                    </div>
                    <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 text-white px-4 py-2 rounded text-sm font-medium">Añadir Nueva Regla</button>
                </div>
                
                <div className="bg-djzinc-900 border border-djzinc-700 rounded-xl mb-6 shadow-lg overflow-hidden">
                    <div className="bg-gradient-to-r from-djzinc-800 to-djzinc-900 px-5 py-3 border-b border-djzinc-700 flex items-center gap-3">
                        <div className="w-3 h-3 rounded-full bg-djcyan-500 shadow-[0_0_8px_#06b6d4]"></div>
                        <h3 className="font-bold text-white tracking-wide">TECHNO <span className="font-normal text-gray-500 text-xs ml-2">(Raíz Serato)</span></h3>
                    </div>
                    <div className="p-2">
                        {['Hard Techno', 'Melodic Techno', 'Peak Time'].map(sub => (
                            <div key={sub} className="flex gap-4 items-center p-3 hover:bg-djzinc-800/50 rounded-lg group transition-colors">
                                <div className="w-6 h-6 border-l-2 border-b-2 border-djzinc-700 rounded-bl-lg ml-2 opacity-50"></div>
                                <div className="w-32 text-sm font-bold text-gray-300">{sub}</div>
                                <div className="flex-1 flex items-center gap-2">
                                    <span className="text-xs text-gray-600 uppercase font-mono">➡ Ruta Fija:</span>
                                    <input type="text" defaultValue={`/Music/Serato/Techno/${sub}/`} className="flex-1 bg-djzinc-950 border border-djzinc-800 rounded px-3 py-2 text-xs font-mono text-gray-400 focus:border-djcyan-500 outline-none transition-colors" />
                                    <button className="bg-djzinc-800 hover:bg-djzinc-700 border border-djzinc-600 rounded p-2 text-gray-400"><Icons.Routing /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        // Pestaña Logs
        const LogsWorkspace = ({ logs, setLogs }) => (
            <div className="flex flex-col h-full p-6 w-full bg-black font-mono">
                <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                        <Icons.Terminal />
                        <h2 className="text-sm font-bold text-gray-400 uppercase tracking-widest">System Console</h2>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setLogs([])} className="text-xs text-djcyan-400 hover:text-white transition-colors">[ Clear ]</button>
                        <button className="text-xs text-gray-500 hover:text-white transition-colors">[ Export .log ]</button>
                    </div>
                </div>
                
                <div className="flex-1 border border-djzinc-800 rounded p-4 text-xs overflow-auto flex flex-col-reverse shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
                    <div>
                        {logs.map((log, idx) => (
                            <div key={idx} className={`mb-1 ${log.type === 'info' ? 'text-djcyan-500' : log.type === 'divider' ? 'text-gray-500 mb-2' : log.type === 'success' ? 'text-djgreen-400' : log.type === 'warn' ? 'text-amber-400' : 'text-gray-300'}`}>
                                {log.text}
                            </div>
                        ))}
                        <div className="flex items-center gap-2 mt-2">
                            <span className="w-2 h-4 bg-djcyan-400 animate-pulse"></span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // Componente Principal
        const App = () => {
            const [activeTab, setActiveTab] = useState('audit');
            const [selectedTrack, setSelectedTrack] = useState(1);
            const [nowPlayingTrack, setNowPlayingTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [playProgress, setPlayProgress] = useState(0.22);
            const audioRef = useRef(null);
            const [logs, setLogs] = useState([
                { type: 'info', text: 'CleanDJmix PRO DSP Engine Initialized.' },
                { type: 'success', text: 'Master Deck Audio Bridge conectado.' }
            ]);

            useEffect(() => {
                const audio = new Audio();
                audio.crossOrigin = "anonymous";
                audio.onended = () => {
                    setIsPlaying(false);
                    setPlayProgress(0);
                };
                audio.ontimeupdate = () => {
                    if (audio.duration) {
                        setPlayProgress(audio.currentTime / audio.duration);
                    }
                };
                audioRef.current = audio;

                return () => {
                    audio.pause();
                    audio.src = "";
                };
            }, []);

            const handlePlayTrack = (track, seekPct = 0, autoPlay = true) => {
                if (!track) return;
                setSelectedTrack(track.id);
                setNowPlayingTrack(track);

                if (autoPlay) {
                    setIsPlaying(true);
                    if (audioRef.current && track.path) {
                        try {
                            const audio = audioRef.current;
                            audio.src = `/stream_audio?path=${encodeURIComponent(track.path)}`;
                            audio.play().then(() => {
                                if (seekPct > 0 && audio.duration) {
                                    audio.currentTime = audio.duration * seekPct;
                                    setPlayProgress(seekPct);
                                }
                            }).catch(() => {
                                console.log("[DECK] Reproduciendo en buffer...");
                            });
                        } catch (err) {
                            console.warn("Audio stream error:", err);
                        }
                    }
                }
            };

            const handleFooterSeek = (pct) => {
                setPlayProgress(pct);
                if (audioRef.current && audioRef.current.duration) {
                    audioRef.current.currentTime = audioRef.current.duration * pct;
                    if (!isPlaying) {
                        audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                    }
                }
            };

            const togglePlayPause = () => {
                if (audioRef.current && nowPlayingTrack && nowPlayingTrack.path) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play().catch(() => {});
                        setIsPlaying(true);
                    }
                } else {
                    setIsPlaying(!isPlaying);
                }
            };

            return (
                <div className="flex h-screen w-screen bg-djzinc-950 text-gray-300 overflow-hidden font-sans">
                    {/* Barra Lateral Navegación */}
                    <div className="w-16 bg-djzinc-950 border-r border-djzinc-800 flex flex-col items-center py-4 gap-6 shrink-0 z-30">
                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-djcyan-500 to-blue-600 flex items-center justify-center text-black font-extrabold text-sm shadow-[0_0_15px_rgba(6,182,212,0.4)] cursor-pointer">
                            <div className="flex items-end gap-[2px] h-4">
                                <span className="w-1 bg-black rounded-sm logo-bar" style={{ animationDuration: '0.6s' }}></span>
                                <span className="w-1 bg-black rounded-sm logo-bar" style={{ animationDuration: '0.4s' }}></span>
                                <span className="w-1 bg-black rounded-sm logo-bar" style={{ animationDuration: '0.8s' }}></span>
                            </div>
                        </div>

                        <div className="flex flex-col gap-3">
                            <button 
                                onClick={() => setActiveTab('audit')} 
                                className={`p-3 rounded-xl transition-all ${activeTab === 'audit' ? 'bg-djcyan-500 text-black shadow-lg shadow-djcyan-500/20' : 'text-gray-400 hover:text-white hover:bg-djzinc-850'}`}
                                title="Mesa de Auditoría"
                            >
                                <Icons.Library />
                            </button>
                            <button 
                                onClick={() => setActiveTab('spotify')} 
                                className={`p-3 rounded-xl transition-all ${activeTab === 'spotify' ? 'bg-[#1DB954] text-black shadow-lg shadow-[#1DB954]/30' : 'text-gray-400 hover:text-[#1DB954] hover:bg-djzinc-850'}`}
                                title="Spotify Matcher & API"
                            >
                                <Icons.Spotify />
                            </button>
                            <button 
                                onClick={() => setActiveTab('taxonomy')} 
                                className={`p-3 rounded-xl transition-all ${activeTab === 'taxonomy' ? 'bg-djcyan-500 text-black shadow-lg shadow-djcyan-500/20' : 'text-gray-400 hover:text-white hover:bg-djzinc-850'}`}
                                title="Ruteo y Taxonomía"
                            >
                                <Icons.Routing />
                            </button>
                            <button 
                                onClick={() => setActiveTab('logs')} 
                                className={`p-3 rounded-xl transition-all ${activeTab === 'logs' ? 'bg-djcyan-500 text-black shadow-lg shadow-djcyan-500/20' : 'text-gray-400 hover:text-white hover:bg-djzinc-850'}`}
                                title="Consola del Sistema"
                            >
                                <Icons.Terminal />
                            </button>
                        </div>
                    </div>

                    {/* Contenedor Central */}
                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
                        <div className="flex-1 overflow-hidden">
                            {activeTab === 'audit' && (
                                <AuditWorkspace 
                                    selectedTrack={selectedTrack} 
                                    setSelectedTrack={setSelectedTrack}
                                    onPlayTrack={handlePlayTrack}
                                    nowPlayingTrack={nowPlayingTrack}
                                    isPlaying={isPlaying}
                                />
                            )}
                            {activeTab === 'spotify' && <SpotifyWorkspace onPlayTrack={handlePlayTrack} nowPlayingTrack={nowPlayingTrack} isPlaying={isPlaying} />}
                            {activeTab === 'taxonomy' && <TaxonomyWorkspace />}
                            {activeTab === 'logs' && <LogsWorkspace logs={logs} setLogs={setLogs} />}
                        </div>

                        {/* Deck Footer Master Reproductor Panorámico */}
                        <div className="h-16 bg-djzinc-950 border-t border-djzinc-800 px-5 flex items-center justify-between shrink-0 glass-panel z-30">
                            {/* Track Info Izquierda */}
                            <div className="flex items-center gap-3 min-w-0 w-64 shrink-0">
                                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-djzinc-900 to-djzinc-850 border border-djzinc-750 flex items-center justify-center font-bold text-xs text-djcyan-400 font-mono shadow-inner shrink-0">
                                    {nowPlayingTrack?.k && nowPlayingTrack.k !== '--' ? nowPlayingTrack.k : 'DJ'}
                                </div>
                                <div className="flex flex-col min-w-0">
                                    <span className="text-xs font-semibold text-white truncate" title={nowPlayingTrack?.t || nowPlayingTrack?.title}>
                                        {nowPlayingTrack ? (nowPlayingTrack.t || nowPlayingTrack.title) : 'Selecciona una pista para reproducir'}
                                    </span>
                                    <span className="text-[10px] text-gray-400 font-mono truncate">
                                        {nowPlayingTrack ? `${nowPlayingTrack.a || 'Desconocido'} • ${nowPlayingTrack.b || '--'} BPM • ${nowPlayingTrack.duration || '0:00'}` : '-- BPM • Camelot --'}
                                    </span>
                                </div>
                            </div>

                            {/* Waveform Panorámico Master Central (Aprovecha Todo el Espacio) */}
                            <FooterMasterWaveform 
                                track={nowPlayingTrack}
                                isPlaying={isPlaying}
                                playProgress={playProgress}
                                onSeek={handleFooterSeek}
                                cues={NV2_COLORS}
                            />

                            {/* Controles de Cabina Derecha */}
                            <div className="flex items-center gap-3 shrink-0">
                                <button 
                                    onClick={() => handleFooterSeek(0)}
                                    className="px-3 py-1 bg-djzinc-850 hover:bg-djzinc-750 text-gray-300 hover:text-white rounded font-mono font-bold text-xs border border-djzinc-700 active:scale-95 transition-all cursor-pointer"
                                >
                                    CUE
                                </button>
                                <button 
                                    onClick={togglePlayPause}
                                    className="w-9 h-9 rounded-full bg-djcyan-500 hover:bg-djcyan-400 text-black flex items-center justify-center transition-all shadow-[0_0_12px_rgba(6,182,212,0.4)] active:scale-90 cursor-pointer"
                                >
                                    {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                                </button>
                                <button className="px-3 py-1 bg-djzinc-850 hover:bg-djzinc-750 text-djcyan-400 hover:text-djcyan-300 rounded font-mono font-bold text-xs border border-djzinc-700/80 active:scale-95 transition-all cursor-pointer">
                                    SYNC
                                </button>
                                <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${
                                    isPlaying ? 'bg-djgreen-950/80 text-djgreen-400 border-djgreen-800/80 animate-pulse' : 'bg-djzinc-900 text-gray-500 border-djzinc-800'
                                }`}>
                                    {isPlaying ? 'ON AIR' : 'DECK IDLE'}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
